[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-trial-prescreening"
version = "1.0.0"
description = "Clinical trial pre-screening: explainable criterion-level eligibility with physician-in-the-loop"
requires-python = ">=3.11"
dependencies = ["fastapi", "pydantic>=2", "sqlalchemy>=2"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
